name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: petfood
          POSTGRES_USER: petfood
          POSTGRES_PASSWORD: petfood_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U petfood -d petfood"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_PASSWORD: petfood_ci_only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon check bootJar -PintegrationTests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    env:
      PETFOOD_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile app config --quiet
      - run: docker compose --profile app up --build --wait --wait-timeout 240
      - name: Smoke test
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:5173/ > /dev/null
          curl --fail http://localhost:5173/api/v1/info | grep 'PetFood'
          curl --fail http://localhost:5173/products | grep 'id="root"'
          curl --fail http://localhost:5173/api/v1/products | jq -e '.totalElements == 2 and ([.items[].sku] | sort) == ["DEMO-CAT-01", "DEMO-DOG-01"]'
          curl --fail http://localhost:8080/actuator/health | grep 'UP'
      - if: failure()
        run: docker compose --profile app logs --no-color
      - if: always()
        run: docker compose --profile app down

