spring:
  application:
    name: petfood-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petfood}
    username: ${DB_USERNAME:petfood}
    password: ${DB_PASSWORD:petfood_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    timeout: 30m
    redis:
      namespace: petfood:session
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: ${MAIL_SMTP_AUTH:false}
        starttls.enable: ${MAIL_STARTTLS:false}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
app:
  mail:
    from: ${MAIL_FROM:noreply@petfood.local}
  admin:
    email: ${PETFOOD_ADMIN_EMAIL:}
    password: ${PETFOOD_ADMIN_PASSWORD:}
    display-name: ${PETFOOD_ADMIN_NAME:Quản trị viên}
  ai:
    # Off by default: search and the assistant then use keyword fallback and no API is called.
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gemini-3.8-flash}
    embedding-model: ${AI_EMBEDDING_MODEL:gemini-embedding-001}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:15}
    quota-per-minute: ${AI_QUOTA_PER_MINUTE:10}
    index-interval-ms: ${AI_INDEX_INTERVAL_MS:60000}

